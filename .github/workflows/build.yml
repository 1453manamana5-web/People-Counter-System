name: Independent build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run evaluate:luxnora
      - run: npm run evaluate:luxnora:reasoning
      - run: npm run evaluate:luxnora:reasoning -- --independent
      - run: npm run evaluate:luxnora:v4
      - run: npm run evaluate:luxnora:v41 -- --independent
